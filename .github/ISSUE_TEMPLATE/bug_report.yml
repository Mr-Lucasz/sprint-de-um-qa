# Formulário de report de bug.
# Campos alinhados ao conteúdo de um relatório de defeito do syllabus CTFL v4.0 (seção 5.5).
# Sintaxe de issue forms: https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Reportar bug
description: Registre uma falha encontrada no Inscrevi com informações para reprodução
title: "[Bug] "
labels: ["defeito", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, confira se outra pessoa já não relatou o mesmo problema.
        Use este padrão no título: **[Bug] [área] - [comportamento observado] - [condição]**.
        Exemplo: *[Bug] Inscrição - aceita aluno - quando o curso está sem vagas*.

  - type: textarea
    id: descricao
    attributes:
      label: Descrição breve
      description: Resuma o problema em uma ou duas frases, sem incluir hipóteses sobre a causa.
      placeholder: "Ao tentar se inscrever em um curso sem vagas, o sistema confirma a inscrição."
    validations:
      required: true

  - type: textarea
    id: precondicoes
    attributes:
      label: Pré-condições
      description: Informe o estado necessário antes do teste, incluindo conta, dados e permissões.
      placeholder: |
        - Usuário autenticado como participante
        - Curso "Introdução a QA" criado e sem vagas disponíveis
    validations:
      required: true

  - type: dropdown
    id: historia
    attributes:
      label: História relacionada
      options: [US01 · Cadastro, US02 · Login, US03 · Programação, US04 · Inscrição, US05 · Minhas inscrições, US06 · Cancelamento, Outra]
    validations:
      required: true

  - type: dropdown
    id: camada
    attributes:
      label: Onde a falha aparece
      options: [API, Interface (front), As duas]
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      description: Numerados, a partir de um estado conhecido. Inclua os dados usados.
      placeholder: |
        1. Fazer login com maria@inscrevi.dev
        2. Abrir a Programação
        3. ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      description: O que deveria acontecer, citando o critério de aceite quando houver.
    validations:
      required: true

  - type: textarea
    id: obtido
    attributes:
      label: Resultado obtido
      description: O que aconteceu de fato. Mensagens, status HTTP e corpo da resposta ajudam muito.
    validations:
      required: true

  - type: dropdown
    id: severidade
    attributes:
      label: Severidade (impacto no sistema)
      options: [Crítica, Alta, Média, Baixa]
    validations:
      required: true

  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade sugerida (urgência da correção)
      options: [Alta, Média, Baixa]
    validations:
      required: true

  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: "Windows 11, Chrome 140, ambiente local, versão 1.0.0-sprint (os dois últimos estão no rodapé do app)"
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Arraste prints, vídeos ou cole logs e respostas da API.

  - type: textarea
    id: adicionais
    attributes:
      label: Informações adicionais
      description: Inclua qualquer contexto útil, como frequência, workaround, links ou observações.

  - type: input
    id: caso
    attributes:
      label: Caso de teste ou charter de origem
      placeholder: "CT-04 ou Charter 2"
